# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    # Stacked pattern-model PRs need the same gates before reaching master.
    branches: [main, master, "pattern-model-*"]

name: test-coverage

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Coverage is the serial line-instrumentation gate. The non-CRAN,
      # process, and long-running contracts run uninstrumented in R-CMD-check,
      # capability-tests, and extended-tests; instrumenting that full court can
      # leave unserializable dependency state in covr's exit-time trace.
      NOT_CRAN: "false"
      RMVPA_RUN_EXTENDED_TESTS: "false"
      RGL_USE_NULL: "TRUE"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        # Dependabot and fork PRs lack OIDC / upload credentials; still measure.
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'))
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
