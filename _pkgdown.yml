url: https://bbuchsbaum.github.io/rMVPA/
code:
  run_dont_test: no
template:
  bootstrap: 5
  package: albersdown
articles:
- title: Get Started
  desc: |
    Start here. Decode real Haxby data with held-out-run validation, inspect
    every error, and learn the object chain shared by regional and searchlight
    analyses.
  contents: rMVPA
- title: Core Concepts
  desc: |
    Essential concepts and basic workflows
  contents:
  - articles/Constructing_Datasets
  - CrossValidation
  - articles/FeatureSelection
- title: Performance and Deployment
  desc: |
    Choose Future process topologies, data transport, and native thread limits
    with reproducible correctness and performance evidence.
  contents:
  - articles/Parallelism
- title: Voxelwise Encoding Models
  desc: |
    Fit leakage-safe grouped encoding models with per-response tuning,
    scalable solvers, explicit storage contracts, and predictive band drop-out.
  contents:
  - articles/Banded_Ridge_Encoding
- title: Standard MVPA Analysis
  desc: |
    Classification and regression analyses using searchlight and regional approaches
  contents:
  - Searchlight_Analysis
  - Regional_Analysis
  - Haxby_2001
  - articles/ITEM_Decoding
  - articles/CommandLine
- title: Pattern Models
  desc: |
    Fit one covariance-aware whole-brain reduced-rank model, then confirm
    frozen loadings on independent data and pool them across subjects.
  contents:
  - Pattern_Model
  - articles/Pattern_Confirmation
  - articles/Pattern_Group
- title: Representational Similarity Analysis
  desc: |
    RSA methods from basic to specialized approaches
  contents:
  - RSA
  - articles/Contrast_RSA
  - articles/Temporal_Confounds_in_RSA
  - articles/Feature_RSA
  - articles/Vector_RSA
  - articles/Feature_RSA_Advanced_Workflows
  - articles/Feature_RSA_Connectivity
  - articles/Model_Space_Connectivity
  - articles/Feature_RSA_Domain_Adaptation
  - articles/Kriegeskorte_92_Images
- title: Representation Mapping (REMAP) Models
  desc: |
    Models for learning transformations between perception and memory representations
  contents:
  - articles/Naive_Cross_Decoding
  - articles/ERA_RSA_Cross_Decoding
  - articles/REMAP_RRR
  - articles/repmap_model
  - articles/repmed_model
  - articles/repnet_model
- title: Extensibility
  desc: |
    Customizing and extending rMVPA functionality
  contents:
  - articles/CustomAnalyses
  - articles/Plugin_Development
- title: internal
  desc: |
    Superseded vignettes retained as redirects. New work should use `vignette("CommandLine")`.
  contents:
  - articles/CommandLineScripts
  - articles/MVPA_RegionalCmdline
reference:
- title: REMAP Diagnostics
  desc: |
    Summaries that quantify how far memory is from perception and how large the learned correction is.
  contents:
  - summarize_remap_roi
  - summarize_remap_items
- title: All Functions
  desc: |
    All functions exported by rMVPA
  contents: matches(".*")
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - tutorials
    - news
    right:
    - search
    - github
